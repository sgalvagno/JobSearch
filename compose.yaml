services:
  api:
    build: .
    ports:
      - '127.0.0.1:8080:80'
    environment:
      JOBSEARCH_DSN: mysql:host=db;port=3306;dbname=jobsearch;charset=utf8mb4
      JOBSEARCH_USERNAME: jobsearch
      JOBSEARCH_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JOBSEARCH_ALLOW_INSECURE_HTTP: 'true'
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: jobsearch
      MARIADB_USER: jobsearch
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - database:/var/lib/mysql
      - ./sql/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  database:
